transition:transform .3s var(--ease),box-shadow .3s var(--ease),filter .3s,opacity .3s}

.bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 22px;border-radius:999px;background:rgba(255,248,232,.94);box-shadow:0 12px 30px rgba(0,0,0,.35);backdrop-filter:blur(8px);width:max-content;max-width:calc(100vw - 24px)}

.foot{position:fixed;right:14px;bottom:6px;font-size:11px;color:#2c3036;opacity:.8;z-index:3}

#ok p{margin:10px 0;font-weight:700}#ok code{display:inline-block;margin:6px 0 18px;font:700 24px 'Space Mono';background:#fff;padding:6px 14px;border:2px dashed var(--red)}

}

 MENU.forEach(m=>{const n=menuQ[m.id];if(!n)return;const pr=m.p*n;tot+=pr;h+=`<div class="rl"><span>${edit?`<button class="rm" data-act="menu-" data-id="${m.id}" aria-label="${t('remove')}">−</button>`:''}${n>1?n+' × ':''}${m[lang]}</span><span><bdi>${fmt(pr)}</bdi></span></div>`});
 const sg={};sides.forEach(o=>sg[o.id]=(sg[o.id]||0)+1);
 Object.keys(sg).forEach(k=>{const n=sg[k],pr=SIDE[k].p*n;tot+=pr;h+=`<div class="rl"><span>${edit?`<button class="rm" data-act="side-" data-id="${k}" aria-label="${t('remove')}">−</button>`:''}${n>1?n+' × ':''}${nm('side',k)}</span><span><bdi>${fmt(pr)}</bdi></span></div>`});
 const any=i||Object.keys(menuQ).length||sides.length;
 if(any&&document.querySelector('input[name=m]:checked').value==='del'){tot+=5;h+=`<div class="rl"><span>${t('del')}</span><span><bdi>${fmt(5)}</bdi></span></div>`}
 return{h:any?h:`<div class="rl"><span>${t('empty')}</span></div>`,tot,any}}
function toText(h){const d=document.createElement('div');d.innerHTML=h;return[...d.children].map(r=>r.classList.contains('bh')?'\n'+r.textContent.trim():[...r.children].map(c=>c.textContent.trim()).join('  ')).join('\n')}
function waMsg(no,tot,body,del){return `عفّيك Fire Wood\n${t('msgHead')} ${no}\n${t(del?'del':'pick')}\n${body}\n\n${t('total')}: ${fmt(tot)}`+(del?`\n${t('msgAddr')}`:'')}
function renderRcp(){const{h,tot,any}=rcpBuild(true);$('#lines').innerHTML=h;$('#tot').innerHTML='<bdi>'+fmt(tot)+'</bdi>';
 $('#co').disabled=!any;$('#more').textContent=t(topped?'more':'keep');$('#back').style.display=topped?'block':'none';
 const pe=$('#pend');pe.textContent=t('pending');pe.style.display=(!topped&&fill()>0)?'block':'none';return tot}
const openRcp=()=>{setMenu(false);renderRcp();rcp.classList.add('open')},closeRcp=()=>rcp.classList.remove('open');
function renderMenu(){$('#mlist').innerHTML=MENU.map(m=>`<div class="mi"><div><h4>${m[lang]}</h4><p>${lang==='ar'?m.dar:m.den}</p></div><div class="sd"><span class="pr"><bdi>${fmt(m.p)}</bdi></span><button class="add" data-id="${m.id}" aria-label="${t('add')} ${m[lang]}">+</button>${menuQ[m.id]?`<em class="q">×${menuQ[m.id]}</em>`:''}</div></div>`).join('')}
function reset(){layers.forEach(l=>l.el.remove());layers=[];hist=[];cart=[];menuQ={};topped=false;while(sides.length){sides.pop().el.remove()}rcp.classList.remove('open');document.querySelector('input[name=m][value=pick]').checked=true;ui()}

/* ---------- events ---------- */
const act=el=>{if(el.classList.contains('locked'))return;add(el.dataset.id,el.classList.contains('bottle')?'sauce':el.dataset.kind)};
document.addEventListener('click',e=>{const c=e.target.closest('.cont,.bottle');if(c)act(c)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const c=e.target.closest('.cont,.bottle,#undo,#back');if(!c)return;e.preventDefault();c.click()});
document.addEventListener('dragstart',e=>{const c=e.target.closest('.cont,.bottle');if(!c||c.classList.contains('locked')){e.preventDefault();return}e.dataTransfer.setData('text/plain',JSON.stringify({id:c.dataset.id,k:c.classList.contains('bottle')?'sauce':c.dataset.kind}))});
[build,$('#sideL')].forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));
 z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');try{const d=JSON.parse(e.dataTransfer.getData('text/plain'));if((z===build)===(d.k!=='side'))add(d.id,d.k)}catch(_){}})});
$('#lang').onclick=()=>setLang(lang==='ar'?'en':'ar');$('#top').onclick=topOff;$('#undo').onclick=undo;$('#back').onclick=untop;
document.querySelectorAll('input[name=m]').forEach(r=>r.onchange=renderRcp);
$('#co').onclick=()=>{const{h,tot,any}=rcpBuild(false);if(!any)return;const no='#FW-'+String(Math.floor(1000+Math.random()*9000));$('#num').textContent=no;
 const del=document.querySelector('input[name=m]:checked').value==='del';
 $('#inv').innerHTML=h+`<hr class="dash"><div class="tot"><span>${t('total')}</span><span><bdi>${fmt(tot)}</bdi></span></div><div class="rl" style="margin-top:6px"><span>${t(del?'del':'pick')}</span></div>`;
 const msg=waMsg(no,tot,toText(h),del),a=(n,k)=>`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}">${t(k)}</a>`;
 $('#wa').innerHTML=del?`<p>${t('waBoth')}</p>`+a(WA.rest,'waRest')+a(WA.driver,'waDrv')+`<p id="waWait" hidden>${t('waWait')}</p>`:a(WA.rest,'waSend')+`<p id="waWait" hidden>${t('waWait')}</p>`;
 closeRcp();setMenu(false);$('#ok').classList.add('show')};
$('#wa').onclick=e=>{if(e.target.closest('a')){const w=$('#waWait');if(w)w.hidden=false}};
$('#edit').onclick=()=>{$('#ok').classList.remove('show');openRcp()};
$('#again').onclick=()=>{$('#ok').classList.remove('show');reset()};
const mpan=$('#menu');
function setMenu(o){if(o)closeRcp();mpan.classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',o);$('#menuBtn .ch').textContent=o?'▴':'▾'}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1700)}
const bump=()=>$('#cart').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:340});
function commit(){if(!topped)return;cart.push(curKeys());
 const g=stack.cloneNode(true);g.removeAttribute('id');g.style.transition='none';build.appendChild(g);
 layers.forEach(l=>l.el.remove());layers=[];topped=false;hist=hist.filter(h=>h.t==='S');fit();
 const T=g.style.transform;g.animate([{transform:T,opacity:1},{transform:T+' translateX(480px) rotate(8deg)',opacity:0}],{duration:560,easing:'cubic-bezier(.5,0,.9,.5)',fill:'forwards'}).onfinish=()=>g.remove();
 toast(t('burgerAdded'));bump();ui()}
$('#menuBtn').onclick=()=>setMenu(!mpan.classList.contains('open'));$('#mclose').onclick=()=>setMenu(false);
$('#cart').onclick=()=>rcp.classList.contains('open')?closeRcp():openRcp();$('#rclose').onclick=closeRcp;
$('#more').onclick=()=>{if(topped)commit();closeRcp()};
$('#mlist').onclick=e=>{const b=e.target.closest('.add');if(!b)return;menuQ[b.dataset.id]=(menuQ[b.dataset.id]||0)+1;toast(t('added'));bump();ui()};
$('#lines').onclick=e=>{const b=e.target.closest('.rm');if(!b)return;const a=b.dataset.act;
 if(a==='cart-')cart.splice(+b.dataset.i,1);
 else if(a==='menu-'){const id=b.dataset.id;if(--menuQ[id]<=0)delete menuQ[id]}
 else if(a==='side-'){const i=sides.map(o=>o.id).lastIndexOf(b.dataset.id);if(i>-1){const o=sides.splice(i,1)[0];o.el.animate([{opacity:1},{transform:'translateY(-30px) scale(.9)',opacity:0}],{duration:240}).onfinish=()=>o.el.remove();const j=hist.map(h=>h.t).lastIndexOf('S');if(j>-1)hist.splice(j,1)}}
 ui()};
const em=$('#embers');for(let i=0;i<22;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;--s:${3+Math.random()*5}px;--d:${9+Math.random()*10}s;--w:${-Math.random()*16}s;--x:${(Math.random()*120-60)}px`;em.appendChild(e)}
addEventListener('resize',fit);
setLang(lang);
</script>
</body>
</html>
